services:
  postgres:
    image: postgres:16-alpine
    container_name: quicktable-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quicktable
      POSTGRES_PASSWORD: quicktable
      POSTGRES_DB: quicktable
    ports:
      - "5432:5432"
    volumes:
      - quicktable-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quicktable"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: quicktable-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - quicktable-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  quicktable-postgres-data:
  quicktable-redis-data:
