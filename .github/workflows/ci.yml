name: CI

# Runs on every push and pull request targeting main. The CD workflow
# (cd.yml) watches for this workflow's completion and only deploys when it
# concludes successfully — see the "ci-success" job at the bottom.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR so pushes don't queue up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend — lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Prisma's generated client is imported throughout the codebase, so
      # lint/typecheck/build all need it in place first.
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Lint
        working-directory: backend
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Type check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: backend
        run: npm test

      - name: Build
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc -b

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3000/api
          VITE_SOCKET_URL: http://localhost:3000

  e2e:
    name: Playwright end-to-end tests
    needs: [backend, frontend]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quicktable
          POSTGRES_PASSWORD: quicktable
          POSTGRES_DB: quicktable
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quicktable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Real for this ephemeral CI database — matches the postgres service above.
      DATABASE_URL: postgresql://quicktable:quicktable@localhost:5432/quicktable?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
      # Throwaway values: nothing in this job ever calls Cloudinary/Resend for
      # real, and these secrets only ever sign tokens inside this one-off CI
      # database — there's no real credential here, so no GitHub Secret is
      # needed for them.
      JWT_ACCESS_SECRET: ci-only-access-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ci-only-refresh-secret
      JWT_REFRESH_EXPIRES_IN: 7d
      CLOUDINARY_CLOUD_NAME: ci-placeholder
      CLOUDINARY_API_KEY: ci-placeholder
      CLOUDINARY_API_SECRET: ci-placeholder
      RESEND_API_KEY: ci-placeholder
      RESEND_FROM_EMAIL: onboarding@resend.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      # --- Backend: migrate, seed, build, run in the background ---
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Apply database migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Seed demo data
        working-directory: backend
        run: npm run seed

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Start backend
        working-directory: backend
        run: nohup node dist/src/main.js > backend.log 2>&1 &

      - name: Wait for backend to be ready
        run: timeout 60 bash -c 'until curl -sf http://localhost:3000/api > /dev/null; do sleep 1; done'

      # --- Frontend: build against the running backend, serve the build ---
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3000/api
          VITE_SOCKET_URL: http://localhost:3000

      - name: Serve frontend build
        working-directory: frontend
        run: nohup npx vite preview --port 5173 --strictPort > frontend.log 2>&1 &

      - name: Wait for frontend to be ready
        run: timeout 60 bash -c 'until curl -sf http://localhost:5173 > /dev/null; do sleep 1; done'

      # --- Playwright ---
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        run: npm test
        env:
          E2E_BASE_URL: http://localhost:5173

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            backend/backend.log
            frontend/frontend.log
          retention-days: 14

  # A single required status check for branch protection, and the anchor
  # cd.yml waits on via workflow_run — deployment only proceeds once this
  # (and therefore everything above) has succeeded.
  ci-success:
    name: CI success
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All CI checks passed."
